<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speech Bridge</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { margin: 0; padding: 1.5rem; max-width: 780px; margin-inline: auto; }
  h1 { font-size: 1.25rem; margin: 0 0 1rem; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
  select, button, input { font: inherit; padding: .45rem .6rem; border-radius: 8px; border: 1px solid #8884; background: #8881; }
  button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
  button[disabled] { opacity: .5; }
  #status { font-size: .85rem; opacity: .75; }
  .caption { border: 1px solid #8883; border-radius: 10px; padding: .75rem; margin-bottom: .6rem; }
  .caption .lbl { font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; opacity: .6; }
  .partial { opacity: .6; font-style: italic; }
  #log { font-size: .8rem; opacity: .6; white-space: pre-wrap; max-height: 8rem; overflow: auto; }
</style>
</head>
<body>
<h1>Speech Bridge &mdash; live interpreter</h1>

<div class="row">
  <label>From
    <select id="src">
      <option value="auto">auto</option><option value="ru" selected>ru</option>
      <option value="uz">uz</option><option value="kaa">kaa</option>
    </select>
  </label>
  <label>To
    <select id="dst">
      <option value="uz" selected>uz</option><option value="ru">ru</option>
      <option value="en">en</option><option value="de">de</option>
    </select>
  </label>
  <label>Voice <input id="voice" size="8" placeholder="default"></label>
  <button id="go" class="primary">Start speaking</button>
  <span id="status">idle</span>
</div>

<div class="caption"><div class="lbl">Transcript</div><div id="transcript"></div><div id="tpartial" class="partial"></div></div>
<div class="caption"><div class="lbl">Translation</div><div id="translation"></div></div>
<div id="log"></div>

<script>
const $ = s => document.querySelector(s);
let ws, audioCtx, micStream, node, playCtx, playHead = 0, running = false;

function log(m){ const el=$("#log"); el.textContent += m+"\n"; el.scrollTop = el.scrollHeight; }
function setStatus(s){ $("#status").textContent = s; }

async function start() {
  running = true; $("#go").textContent = "Stop"; $("#go").classList.remove("primary");
  $("#transcript").textContent = ""; $("#translation").textContent = ""; $("#tpartial").textContent = "";

  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/v1/stream`);
  ws.binaryType = "arraybuffer";
  let pendingAudioHeader = null;

  ws.onopen = async () => {
    setStatus("connected");
    ws.send(JSON.stringify({ type:"start", source_lang:$("#src").value, target_lang:$("#dst").value,
      voice:$("#voice").value, sample_rate:16000, format:"f32" }));
    await startMic();
  };
  ws.onclose = () => { setStatus("closed"); stop(true); };
  ws.onerror = () => setStatus("error");
  ws.onmessage = ev => {
    if (typeof ev.data !== "string") { if (pendingAudioHeader) { playPCM(ev.data, pendingAudioHeader.sample_rate); pendingAudioHeader = null; } return; }
    const m = JSON.parse(ev.data);
    if (m.type === "partial") $("#tpartial").textContent = m.text;
    else if (m.type === "transcript") { $("#tpartial").textContent = ""; $("#transcript").textContent += (m.text + " "); }
    else if (m.type === "translation") $("#translation").textContent += (m.text + " ");
    else if (m.type === "audio") pendingAudioHeader = m;
    else if (m.type === "error") log(`error [${m.stage}/${m.code}] seq=${m.seq} ${m.text||""}`);
    else if (m.type === "done") log("stream done");
  };
}

async function startMic() {
  micStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount:1, echoCancellation:true, noiseSuppression:true } });
  audioCtx = new AudioContext({ sampleRate: 16000 });
  const src = audioCtx.createMediaStreamSource(micStream);
  await audioCtx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type:"application/javascript" })));
  node = new AudioWorkletNode(audioCtx, "pcm-tap");
  node.port.onmessage = e => { if (ws && ws.readyState === 1) ws.send(e.data); };
  src.connect(node); node.connect(audioCtx.destination);
  setStatus("listening");
}

const WORKLET = `
class PCMTap extends AudioWorkletProcessor {
  constructor(){ super(); this.buf = []; this.N = 4000; } // ~250ms @16k
  process(inputs){
    const ch = inputs[0][0]; if (!ch) return true;
    for (let i=0;i<ch.length;i++) this.buf.push(ch[i]);
    while (this.buf.length >= this.N) {
      const out = new Float32Array(this.buf.splice(0, this.N));
      this.port.postMessage(out.buffer, [out.buffer]);
    }
    return true;
  }
}
registerProcessor("pcm-tap", PCMTap);
`;

function playPCM(arrbuf, rate) {
  if (!playCtx) { playCtx = new AudioContext(); playHead = playCtx.currentTime; }
  const f32 = new Float32Array(arrbuf);
  const b = playCtx.createBuffer(1, f32.length, rate || 22050);
  b.copyToChannel(f32, 0);
  const s = playCtx.createBufferSource(); s.buffer = b; s.connect(playCtx.destination);
  const t = Math.max(playCtx.currentTime, playHead);
  s.start(t); playHead = t + b.duration;
}

function stop(fromClose) {
  running = false; $("#go").textContent = "Start speaking"; $("#go").classList.add("primary");
  if (node) node.disconnect();
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (audioCtx) audioCtx.close();
  audioCtx = node = micStream = null;
  if (!fromClose && ws && ws.readyState === 1) { ws.send(JSON.stringify({ type:"stop" })); }
  setStatus("idle");
}

$("#go").onclick = () => running ? stop() : start();
</script>
</body>
</html>
